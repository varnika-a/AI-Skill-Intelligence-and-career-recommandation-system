{% extends 'base.html' %}

{% block content %}
<h2>Upload Resume for {{ student.name }}</h2>
<form method="post" enctype="multipart/form-data">
  <div class="mb-3">
    <input type="file" name="resume" accept=".pdf" class="form-control">
  </div>
  <button class="btn btn-primary">Upload</button>
</form>
{% endblock %}
