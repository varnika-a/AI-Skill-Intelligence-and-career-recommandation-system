{% extends 'base.html' %}

{% block content %}
<h2>Confirm Extracted Skills — {{ student.name }}</h2>
<form method="post">
  <p class="text-muted">Review the automatically extracted skills from your resume and select which to accept.</p>
  <div class="list-group">
    {% for skill, conf in extracted %}
      <label class="list-group-item">
        <input type="checkbox" name="accept_{{ loop.index0 }}" value="1" checked>
        <strong>{{ skill }}</strong>
        <small class="text-muted"> confidence: {{ (conf*100)|round(0) }}%</small>
        <input type="hidden" name="skill_{{ loop.index0 }}" value="{{ skill }}">
        <input type="hidden" name="conf_{{ loop.index0 }}" value="{{ conf }}">
      </label>
    {% else %}
      <div class="alert alert-warning">No skills were extracted.</div>
    {% endfor %}
  </div>
  <div class="mt-3">
    <button class="btn btn-primary">Save Selected Skills</button>
    <a class="btn btn-secondary" href="{{ url_for('profile.view_profile', student_id=student.id) }}">Cancel</a>
  </div>
</form>
{% endblock %}
